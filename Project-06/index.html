<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Project 06</title>
</head>

<body>
    <h1 align="center">This is first table</h1>
    <table border="1" width="50%" align="center">
        <tr align="center">
            <td colspan="4">1</td>
        </tr>
        <tr align="center">
            <td rowspan="2">2</td>
            <td rowspan="2">3</td>
            <td colspan="2">4</td>
        </tr>
        <tr align="center">
            <td>5</td>
            <td>6</td>
        </tr>
        <tr align="center">
            <td colspan="4">
                7
            </td>
        </tr>
    </table>

    <h1 align="center">This is second table</h1>
    <table border="1" width="50%" align="center" cellpadding="10" cellspacing="0">
        <tr align="center">
            <td colspan="2">cell 1</td>
            <td>cell 2</td>
            <td>cell 3</td>
        </tr>
        <tr align="center">
            <td rowspan="3">cell 4</td>
            <td>cell 5</td>
            <td>cell 6</td>
            <td>cell 7</td>
        </tr>
        <tr align="center">
            <td colspan="3">cell 8</td>
        </tr>
        <tr align="center">
            <td colspan="2">cell 9</td>
            <td>cell 10</td>
        </tr>
    </table>
</body>

</html>
