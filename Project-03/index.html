<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Project 03</title>
</head>

<body>
    <h1 align="center">Application Form</h1>
    <form>
        <!-- personal information  -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name </label><br>
            <input type="text" id="name" placeholder="Enter your full name..."><br><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" placeholder="Enter your email..."><br><br>

            <label for="number">Phone Number</label><br>
            <input type="number" id="number" placeholder="Enter your phone number..."><br> <br>

            <label for="dob">Date Of Birth</label><br>
            <input type="date" id="dob"> <br><br>

            <label for="gender">Gender : </label>
            <input type="radio"> Male
            <input type="radio"> Female
            <input type="radio"> Other <br><br>

            <label for="address">Address</label><br>
            <textarea id="address" placeholder="Enter your address..."></textarea>

        </fieldset>

        <!-- educational details  -->
        <fieldset>
            <legend>Educational Details</legend>
            <label>Highest Qualification</label><br>
            <select>
                <option>--select option--</option>
                <option>10th</option>
                <option>12th</option>
                <option>Graduation</option>
                <option>Post Graduation</option>
                <option>Other</option>
            </select> <br><br>

            <label>Skills : </label>
            <input type="checkbox">HTML
            <input type="checkbox">CSS
            <input type="checkbox">Bootstrap
            <input type="checkbox">JavaScript <br><br>

            <label for="resume">Upload Resume</label><br>
            <input type="file"><br><br>
            <button type="button">Submit Application</button>
            <button type="reset">Reset Form</button>
        </fieldset>

    </form>
</body>

</html>
